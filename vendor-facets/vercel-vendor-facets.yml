- https://vercel.com/changelog/vercels-bot-verification-now-supports-web-bot-auth
- https://vercel.com/docs/agent-resources/markdown-access
- https://vercel.com/docs/mcp/deploy-mcp-servers-to-vercel
- https://vercel.com/kb/guide/make-your-documentation-readable-by-ai-agents
